<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ Basic Site Metadata -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Rishi's Minimalist Blog — thoughts, code, and stories on creativity, design, and simplicity."
    />

    <!-- ✅ Favicon & App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Custom Fonts (served directly from /public folder) -->
    <style>
      @font-face {
        font-family: 'Poppins';
        src: url('%PUBLIC_URL%/Poppins.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: 'Karla';
        src: url('%PUBLIC_URL%/Karla.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: 'Monsterrat';
        src: url('%PUBLIC_URL%/monsterrat.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }

      /* Optional: base global font styling (just a fallback before React mounts) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #EFEEEA;
        font-family: 'Karla', sans-serif;
        color: #181818;
      }
    </style>

    <!-- ✅ Title -->
    <title>Rishi | Minimalist Blog</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- ✅ Optional: analytics or future scripts can go below -->
    <!-- <script src="%PUBLIC_URL%/analytics.js"></script> -->
  </body>
</html>
